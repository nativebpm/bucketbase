# ==============================================================================
# 🚀 PocketStream CI/CD Pipeline
# ==============================================================================
# Stages:
# 1. test: Run isolated Go unit & integration tests
# 2. build: Build and push Docker images with Docker Buildx registry caching
# ==============================================================================

workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|pipeline|trigger|api)$/'
    - when: never

default:
  interruptible: true
  retry: 2

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"
  BUILDX_PLATFORM: "linux/amd64"

stages:
  - test
  - build

# ─── Stage 1: Testing ──────────────────────────────────────────────────────────

test:
  stage: test
  image: golang:1.27-alpine
  script:
    - apk add --no-cache git build-base
    - echo "Running PocketStream unit tests..."
    - GOWORK=off go test -v -count=1 ./...
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|pipeline|trigger|api)$/'

# ─── Stage 2: Docker Buildx with BuildKit Registry Caching ─────────────────────

.buildx_base:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      command: ["--experimental"]
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "Setting up Docker Buildx container builder..."
    - docker buildx create --use --name ps-builder --driver docker-container 2>/dev/null || docker buildx use ps-builder
    - docker buildx inspect --bootstrap
  after_script:
    - docker buildx prune -f --keep-storage=0 2>/dev/null || true
    - docker image prune -f 2>/dev/null || true

build:pocketstream:
  extends: .buildx_base
  script:
    - |
      TARGET_TAGS="-t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TARGET_TAGS="${TARGET_TAGS} -t ${CI_REGISTRY_IMAGE}:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TARGET_TAGS="${TARGET_TAGS} -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}"
      fi
      if [ "$CI_COMMIT_BRANCH" != "main" ] && [ -n "$CI_COMMIT_REF_SLUG" ]; then
        TARGET_TAGS="${TARGET_TAGS} -t ${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      fi

      echo "Building PocketStream image with tags: ${TARGET_TAGS}"
      docker buildx build \
        --platform "${BUILDX_PLATFORM}" \
        --builder ps-builder \
        --cache-to=type=registry,ref="${CI_REGISTRY_IMAGE}:cache",mode=max \
        --cache-from=type=registry,ref="${CI_REGISTRY_IMAGE}:cache" \
        ${TARGET_TAGS} \
        --push .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|pipeline|trigger|api)$/'

build:litestream:
  extends: .buildx_base
  script:
    - |
      LITESTREAM_IMAGE="${CI_REGISTRY_IMAGE}/litestream"
      TARGET_TAGS="-t ${LITESTREAM_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        TARGET_TAGS="${TARGET_TAGS} -t ${LITESTREAM_IMAGE}:latest"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        TARGET_TAGS="${TARGET_TAGS} -t ${LITESTREAM_IMAGE}:${CI_COMMIT_TAG}"
      fi
      if [ "$CI_COMMIT_BRANCH" != "main" ] && [ -n "$CI_COMMIT_REF_SLUG" ]; then
        TARGET_TAGS="${TARGET_TAGS} -t ${LITESTREAM_IMAGE}:${CI_COMMIT_REF_SLUG}"
      fi

      echo "Building Litestream companion image with tags: ${TARGET_TAGS}"
      docker buildx build \
        --platform "${BUILDX_PLATFORM}" \
        --builder ps-builder \
        -f Dockerfile.litestream \
        --cache-to=type=registry,ref="${LITESTREAM_IMAGE}:cache",mode=max \
        --cache-from=type=registry,ref="${LITESTREAM_IMAGE}:cache" \
        ${TARGET_TAGS} \
        --push .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
    - if: '$CI_PIPELINE_SOURCE =~ /^(schedule|web|pipeline|trigger|api)$/'
